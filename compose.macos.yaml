# Standalone Mac model. Runtime paths are guest paths from config/macos/machine.json.
# Only the four unprofiled services start. Never enable agentcore-pending with this kit pin.
# No ARM64 runtime or fresh named-volume ownership claim follows from Compose parsing.
name: tenant-ec2-macos
services:
  litellm:
    image: litellm-gateway:1.103.0-p0.4.1
    pull_policy: never
    restart: unless-stopped
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    command:
    - --config
    - /config/config.yaml
    - --host
    - 0.0.0.0
    - --port
    - '4000'
    environment:
      HOME: /tmp
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_TELEMETRY: 'False'
      LITELLM_DISABLE_NO_REDIS_WARNING: 'true'
      EXPERIMENTAL_UI_LOGIN: 'false'
      LITELLM_MASTER_KEY: ${EC2_LITELLM_MASTER_KEY:?add a value to .env (.env.example)}
      LITELLM_SALT_KEY: ${EC2_LITELLM_SALT_KEY:?add a value to .env (.env.example)}
      UI_USERNAME: ${EC2_LITELLM_UI_USERNAME:?add a value to .env (.env.example)}
      UI_PASSWORD: ${EC2_LITELLM_UI_PASSWORD:?add a value to .env (.env.example)}
      DATABASE_URL: postgresql://litellm:${EC2_LITELLM_POSTGRES_PASSWORD:?add a value
        to .env (.env.example)}@litellm-db:5432/litellm
      BEDROCK_LUNA_MODEL: bedrock/converse/${EC2_BEDROCK_LUNA_MODEL:?add a value to
        .env (.env.example)}
      BEDROCK_LUNA_MODEL_ID: ${EC2_BEDROCK_LUNA_MODEL:?add a value to .env (.env.example)}
      BEDROCK_EMBED_MODEL: bedrock/${EC2_BEDROCK_EMBED_MODEL:?add a value to .env
        (.env.example)}
      AWS_REGION_NAME: ${EC2_AWS_REGION:?add a value to .env (.env.example)}
      TZ: ${EC2_TZ:?add a value to .env (.env.example)}
      AWS_CONFIG_FILE: /run/tenant-ec2/aws/config
      AWS_PROFILE: ec2-instance
      AWS_SHARED_CREDENTIALS_FILE: /run/tenant-ec2/aws/empty
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SDK_LOAD_CONFIG: '1'
    volumes:
    - type: bind
      source: /var/lib/tenant-ec2/aws-litellm
      target: /run/tenant-ec2/aws
      read_only: true
      bind:
        create_host_path: false
        selinux: z
    - type: bind
      source: /run/tenant-ec2/litellm/config.yaml
      target: /config/config.yaml
      read_only: true
      bind:
        create_host_path: false
    networks:
    - db
    - llm
    - egress
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -S
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    platform: linux/arm64
  litellm-db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    user: 999:999
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${EC2_LITELLM_POSTGRES_PASSWORD:?add a value to .env (.env.example)}
      TZ: ${EC2_TZ:?add a value to .env (.env.example)}
    volumes:
    - litellm-db:/var/lib/postgresql/data
    networks:
    - db
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U litellm -d litellm
      interval: 5s
      timeout: 5s
      retries: 10
    platform: linux/arm64
  open-knowledge:
    image: open-knowledge:0.83.2-p0.3.2
    pull_policy: never
    restart: unless-stopped
    environment:
      PORT: '4180'
      OK_BIND: 0.0.0.0
      OK_ALLOW_EXTERNAL: '1'
      OK_EXTERNAL_URL: http://localhost:4180
      OK_IDLE_SHUTDOWN: 'off'
      DO_NOT_TRACK: '1'
      OK_LOG_LEVEL: warn
      OK_MCP_AUTOSTART: '0'
      TZ: ${EC2_TZ:?add a value to .env (.env.example)}
    volumes:
    - open-knowledge:/data
    networks:
    - knowledge
    - knowledge-agent
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4180/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    platform: linux/arm64
  ok-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5-alpine@sha256:8e4bec4f9fe4de10de63070209204075e4407503170aa19893d6e8d99f083d1b
    restart: unless-stopped
    user: 65532:65532
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    command:
    - --config
    - /etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${EC2_OK_ENTRA_TENANT_ID:?add
        a value to .env (.env.example)}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${EC2_OK_OIDC_CLIENT_ID:?add a value to .env (.env.example)}
      OAUTH2_PROXY_CLIENT_SECRET: ${EC2_OK_OIDC_CLIENT_SECRET:?add a value to .env
        (.env.example)}
      OAUTH2_PROXY_COOKIE_SECRET: ${EC2_OK_COOKIE_SECRET:?add a value to .env (.env.example)}
      OAUTH2_PROXY_ALLOWED_GROUPS: ${EC2_OK_ENTRA_GROUP_ID:?add a value to .env (.env.example)}
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: localhost:4180
      TZ: ${EC2_TZ:?add a value to .env (.env.example)}
    volumes:
    - type: bind
      source: /run/tenant-ec2/oauth2-proxy.cfg
      target: /etc/oauth2-proxy/oauth2-proxy.cfg
      read_only: true
      bind:
        create_host_path: false
    networks:
    - knowledge
    - gate-egress
    depends_on:
      open-knowledge:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:4180/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    platform: linux/arm64
    ports:
    - 127.0.0.1:4180:4180
  pi-durable:
    image: pi-durable:1.0.0-p0.1.0
    pull_policy: never
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      AWS_CONFIG_FILE: /run/tenant-ec2/aws/config
      AWS_PROFILE: ec2-instance
      AWS_SHARED_CREDENTIALS_FILE: /run/tenant-ec2/aws/empty
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SDK_LOAD_CONFIG: '1'
    volumes:
    - type: bind
      source: /var/lib/tenant-ec2/aws-pi-durable
      target: /run/tenant-ec2/aws
      read_only: true
      bind:
        create_host_path: false
    - pi-durable:/data
    - type: bind
      source: /run/tenant-ec2/memory.json
      target: /run/tenant-ec2/memory.json
      read_only: true
      bind:
        create_host_path: false
    networks:
    - llm
    - egress
    - knowledge-agent
    depends_on:
      litellm:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:5470/v1/').then(r=>process.exit(r.status===401?0:1),()=>process.exit(1))
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    platform: linux/arm64
    profiles:
    - agentcore-pending
    x-runtime-gate: Do not enable. The locked kit has no AgentCore adapter. No backend
      or capture interface is configured.
volumes:
  litellm-db: {}
  open-knowledge: {}
  pi-durable: {}
networks:
  db:
    internal: true
  llm:
    internal: true
  knowledge:
    internal: true
  knowledge-agent:
    internal: true
  egress: {}
  gate-egress: {}
