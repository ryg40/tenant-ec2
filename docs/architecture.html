  "tours": [
   {
    "id": "aws-core",
    "label": "01 AWS core",
    "diagram": "aws-core",
    "steps": [
     {
      "nodes": [
       "provisioner",
       "boundary",
       "instance-role"
      ],
      "text": "The provisioner is a scoped IAM user. It deploys the host stack. Each host role gets the permissions boundary."
     },
     {
      "nodes": [
       "instance-role",
       "key-pair",
       "instance"
      ],
      "text": "InstanceProfile attaches InstanceRole to the instance. The stack imports the SSH public key. The private key stays off EC2."
     },
     {
      "nodes": [
       "elastic-ip",
       "instance-sg",
       "instance"
      ],
      "text": "The Elastic IP is the stable public address. The security group accepts TCP 80 and 443, and SSH from AdminCidr only."
     },
     {
      "nodes": [
       "instance",
       "internet-route"
      ],
      "text": "One public subnet holds the instance. Its outbound traffic uses the internet gateway and the default route."
     },
     {
      "nodes": [
       "instance",
       "data-volume"
      ],
      "text": "The encrypted gp3 data volume holds Postgres and the agent state. The stack retains it."
     },
     {
      "nodes": [
       "efs-sg",
       "mount-target",
       "efs",
       "access-points"
      ],
      "text": "EFS accepts TCP 2049 from the host security group only. The mount uses TLS and IAM. Three access points fix the user and group ids."
     },
     {
      "nodes": [
       "instance-role",
       "stack-secret",
       "bedrock"
      ],
      "text": "InstanceRole lets the host read its secret and invoke Bedrock. No provisioner key goes to EC2."
     },
     {
      "nodes": [
       "bucket",
       "snapshots",
       "host-logs",
       "billing-alarm"
      ],
      "text": "EnableBucket and EnableOperations are separate switches. Both are off by default. They add a bucket, snapshots, host logs and a billing alarm."
     }
    ]
   },
   {
    "id": "services",
    "label": "02 Core services",
    "diagram": "services",
    "steps": [
     {
      "nodes": [
       "caddy"
      ],
      "text": "The core uses compose.yaml with compose.caddy.yaml. Only caddy publishes ports: TCP 80 and 443."
     },
     {
      "nodes": [
       "caddy",
       "ok-auth",
       "open-knowledge"
      ],
      "text": "The public name ok.\u003cdomain\u003e targets ok-auth. The gate sends allowed browser requests to open-knowledge on knowledge."
     },
     {
      "nodes": [
       "ok-auth",
       "entra"
      ],
      "text": "The gate reaches Microsoft Entra ID on gate-egress. The gate is the only member of that network."
     },
     {
      "nodes": [
       "pi-durable",
       "open-knowledge",
       "openviking"
      ],
      "text": "The basic agent calls OpenKnowledge directly on knowledge-agent. Its memory calls go to OpenViking with a user key."
     },
     {
      "nodes": [
       "pi-durable",
       "openviking",
       "litellm",
       "litellm-db"
      ],
      "text": "The agent and OpenViking call litellm with separate virtual keys. The gateway reaches Postgres on db."
     },
     {
      "nodes": [
       "litellm",
       "bedrock"
      ],
      "text": "The gateway uses the instance role for bedrock/luna at xhigh and bedrock/embed. Its outbound calls use egress."
     },
     {
      "nodes": [
       "caddy",
       "litellm-db",
       "pi-durable",
       "open-knowledge",
       "openviking",
       "data-volume",
       "access-points"
      ],
      "text": "Each card names its store. The EBS data volume holds the database and local state. The EFS access points hold the files of knowledge and memory, and the shared files."
     }
    ]
   },
   {
    "id": "entra-login",
    "label": "03 Entra login",
    "diagram": "entra-login",
    "steps": [
     {
      "nodes": [
       "browser",
       "caddy",
       "ok-auth"
      ],
      "text": "1. The browser opens ok.\u003cdomain\u003e. Caddy ends HTTPS and sends the request to ok-auth on HTTP port 4180."
     },
     {
      "nodes": [
       "ok-auth",
       "browser"
      ],
      "text": "2. The browser has no session. The gate redirects it to Microsoft Entra ID."
     },
     {
      "nodes": [
       "browser",
       "entra",
       "ok-auth"
      ],
      "text": "3. The user signs in. Entra returns the code through the browser to /oauth2/callback on the same public name."
     },
     {
      "nodes": [
       "ok-auth",
       "entra"
      ],
      "text": "4. The gate exchanges the code on gate-egress. It sends the client secret and the PKCE verifier. Entra returns the ID token."
     },
     {
      "nodes": [
       "ok-auth"
      ],
      "text": "5 and 6. The gate checks the signature, tenant issuer, client id, nonce and expiry. Then it requires the allowed group."
     },
     {
      "nodes": [
       "ok-auth",
       "browser"
      ],
      "text": "7. The gate sets the Secure, HttpOnly __Host-ok cookie. Then it redirects the browser to the page."
     },
     {
      "nodes": [
       "ok-auth",
       "open-knowledge"
      ],
      "text": "8. Only an allowed session reaches OpenKnowledge. Each later browser request still passes through the gate."
     },
     {
      "nodes": [
       "pangolin",
       "ok-auth"
      ],
      "text": "The Pangolin option replaces Caddy, not the gate. Its ok resource has no second login."
     }
    ]
   },
   {
    "id": "install-flow",
    "label": "04 Install flow",
    "diagram": "install-flow",
    "steps": [
     {
      "nodes": [
       "step-provisioner",
       "provisioner"
      ],
      "text": "1. An administrator prepares the provisioner and the boundary. The provisioner creates only bounded roles."
     },
     {
      "nodes": [
       "step-env"
      ],
      "text": "2. The installer sets the core names and the Entra values in .env. EC2_OPTIONS and the edge names select the options."
     },
     {
      "nodes": [
       "step-secret",
       "stack-secret"
      ],
      "text": "3. aws-host.sh secret writes \u003cproject\u003e/env to Secrets Manager. The first boot reads it."
     },
     {
      "nodes": [
       "step-deploy",
       "instance",
       "elastic-ip"
      ],
      "text": "4. aws-host.sh deploy runs CloudFormation. It makes the instance and the Elastic IP."
     },
     {
      "nodes": [
       "step-dns",
       "dns-records"
      ],
      "text": "5. The DNS step reads the Elastic IP. It sets the selected A records while the host boots."
     },
     {
      "nodes": [
       "step-user-data",
       "data-volume",
       "access-points"
      ],
      "text": "6. User data checks the snapshot commit and mounts the data. Docker requires four durable mounts and the metadata guard."
     },
     {
      "nodes": [
       "step-bootstrap",
       "stack-secret"
      ],
      "text": "7. The bootstrap reads the secret and writes the host .env. It selects COMPOSE_FILE."
     },
     {
      "nodes": [
       "step-kits"
      ],
      "text": "8. The bootstrap clones the kit tags of kits.lock and checks the commits. It builds one kit at a time."
     },
     {
      "nodes": [
       "step-start",
       "core-services"
      ],
      "text": "9. The bootstrap starts the edge, the gateway, memory and the rest. It makes scoped service keys."
     },
     {
      "nodes": [
       "step-verify",
       "instance"
      ],
      "text": "10. aws-host.sh verify sends one SSM command with four internal check parts. It proves no public route."
     }
    ]
   },
   {
    "id": "options",
    "label": "05 Options",
    "diagram": "options",
    "steps": [
     {
      "nodes": [
       "core-services",
       "caddy"
      ],
      "text": "The portable core needs no option. An option stays off until the installer selects it."
     },
     {
      "nodes": [
       "pangolin",
       "caddy",
       "ok-auth"
      ],
      "text": "EC2_OPTIONS=pangolin replaces caddy with Pangolin, Gerbil and Traefik. The ok resource still targets the gate."
     },
     {
      "nodes": [
       "newt-site",
       "pangolin"
      ],
      "text": "A home Newt site opens an outbound tunnel to Gerbil. Sites use UDP 51820, and clients use UDP 21820."
     },
     {
      "nodes": [
       "porkbun-dns01",
       "dns-credentials",
       "pangolin"
      ],
      "text": "Pangolin needs Porkbun DNS-01 for its wildcard certificate. Its Porkbun pair is the only DNS credential on the host."
     },
     {
      "nodes": [
       "copilot",
       "copilot-routes",
       "copilot-tokens",
       "litellm"
      ],
      "text": "EC2_OPTIONS=copilot adds the copilot service and its model routes. The Bedrock routes stay. The token files stay on the EBS data volume."
     },
     {
      "nodes": [
       "dns-providers",
       "dns-records",
       "dns-credentials",
       "elastic-ip"
      ],
      "text": "EC2_DNS_PROVIDER selects manual, porkbun, route53 or cloudflare. Each selected name gets an A record to the Elastic IP."
     },
     {
      "nodes": [
       "home-tools",
       "credential-stores",
       "pi-durable",
       "step-kits",
       "provisioner"
      ],
      "text": "Home lab tools stay optional: a Newt site, web search and private kit sources. Bitwarden and Vault hold optional credential copies."
     }
    ]
   }
  ]

  function draw() {

    var b = GEO.bounds, margin = 2400;
    make("rect", { "class": "backdrop", x: b[0] - margin, y: b[1] - margin,

  // --- the camera ---
  function apply() {
    view.setAttribute("transform", "translate(" + cam.x.toFixed(2) + " " + cam.y.toFixed(2) + ") scale(" + cam.k.toFixed(4) + ")");
  }
  function size() {

  }
  function stop() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

    function frame(now) {
      if (start === null) start = now;
      var t = Math.min(1, (now - start) / 480);
      var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      cam = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, k: from.k + (target.k - from.k) * e };

  // --- the state ---
  function visible(id) {

  function matches(n) {

  }
  function focus() {
    var f = { nodes: Object.create(null), edges: Object.create(null), mode: "" };
    if (state.path) {
      f.mode = "path";
      state.path.nodes.forEach(function (id) { f.nodes[id] = true; });
      state.path.steps.forEach(function (s) { f.edges[s.edge.id] = true; });
    } else if (state.selected) {
      f.mode = "select";
      f.nodes[state.selected] = true;
      outEdges[state.selected].concat(inEdges[state.selected]).forEach(function (e) {
        var other = e.from === state.selected ? e.to : e.from;
        if (visible(other)) { f.nodes[other] = true; f.edges[e.id] = true; }

    } else if (state.tour) {
      f.mode = "tour";
      tours[state.tour].steps[state.step].nodes.forEach(function (id) { f.nodes[id] = true; });
      G.edges.forEach(function (e) { if (f.nodes[e.from] && f.nodes[e.to]) f.edges[e.id] = true; });
    } else if (state.query) {
      f.mode = "search";

  function update() {
    var f = focus();
    svg.classList.toggle("focus", !!f);
    G.nodes.forEach(function (n) {
      var el = nodeEl[n.id];
      el.classList.toggle("hidden", !visible(n.id));
      el.classList.toggle("on", !!(f && f.nodes[n.id]));
      el.classList.toggle("sel", state.selected === n.id);
      el.classList.toggle("onpath", !!(f && f.mode === "path" && f.nodes[n.id]));
      el.classList.toggle("match", !!(f && f.mode === "search" && f.nodes[n.id]));

  // --- the tours ---

  // --- the drawer ---

  // --- the input ---

          tip.hidden = true;
          svg.classList.add("panning");
        }
        if (drag.moved) { cam = { x: drag.cx + dx, y: drag.cy + dy, k: cam.k }; apply(); }
      }
      moveTip(ev);
    });
    window.addEventListener("pointerup", function (ev) {
      if (!drag) return;
      var d = drag;
      drag = null;
      svg.classList.remove("panning");
      if (d.moved) return;
      if (d.node) select(d.node, false);
      else if (svg.contains(ev.target) && state.selected) select(null, false);
    });
    svg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      stop();
      var s = size(), px = ev.clientX - s.left, py = ev.clientY - s.top;
      var dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
      var k = Math.min(3, Math.max(0.08, cam.k * Math.exp(-dy * 0.0016)));
      cam = { x: px - (px - cam.x) * k / cam.k, y: py - (py - cam.y) * k / cam.k, k: k };
      apply();
    }, { passive: false });
    svg.addEventListener("pointerover", function (ev) {
      var id = nodeOf(ev.target);
      if (!id || drag) return;
      var n = nodes[id];
      tip.textContent = "";
      tag("strong", "", tip, n.label);
      tag("span", "", tip, groups[n.group].label + " / " + statuses[n.status].label);
      tip.hidden = false;
      moveTip(ev);
    });
    svg.addEventListener("pointerout", function (ev) {
      var id = nodeOf(ev.target);
      if (id && nodeOf(ev.relatedTarget) !== id) tip.hidden = true;
    });
    svg.addEventListener("keydown", function (ev) {
      var id = nodeOf(ev.target);
      if (id && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); select(id, true); }
    });
    document.addEventListener("keydown", function (ev) {
      var t = ev.target, field = t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
      if (ev.key === "Escape") {
        if (drawerShown()) { ev.preventDefault(); setDrawer(false, true); return; }
        if (state.selected) state.selected = null;
        else if (state.path) { clearPath(); return; }
        else if (state.tour) state.tour = null;
        else if (state.query) { state.query = ""; byId("search").value = ""; }
        update();
        return;
      }
      if (field || !state.tour) return;
      if (ev.key === "ArrowRight" || ev.key === "ArrowDown") { ev.preventDefault(); stepTour(1); }
      else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") { ev.preventDefault(); stepTour(-1); }
    });
  }

  draw();
  buildControls();
  bindInput();
  update();
  fitAll(false);
  document.documentElement.setAttribute("data-ready", "true");
})();
</script>
</body>
</html>
