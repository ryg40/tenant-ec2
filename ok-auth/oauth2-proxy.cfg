# The fixed settings of the gate of OpenKnowledge: oauth2-proxy in the service `ok-auth`.
# compose.yaml mounts this file read-only. The page docs/entra.md explains the gate.
#
# This file holds no secret and no value of one install. The values of one install come
# from the environment of the service (compose.yaml), and so from the environment file:
#   OAUTH2_PROXY_OIDC_ISSUER_URL     the tenant (EC2_OK_ENTRA_TENANT_ID)
#   OAUTH2_PROXY_CLIENT_ID           the app registration (EC2_OK_OIDC_CLIENT_ID)
#   OAUTH2_PROXY_CLIENT_SECRET       its secret (EC2_OK_OIDC_CLIENT_SECRET)
#   OAUTH2_PROXY_COOKIE_SECRET       the key of the session cookie (EC2_OK_COOKIE_SECRET)
#   OAUTH2_PROXY_ALLOWED_GROUPS      the one security group (EC2_OK_ENTRA_GROUP_ID)
#   OAUTH2_PROXY_REDIRECT_URL        https://ok.<EC2_DOMAIN>/oauth2/callback
#   OAUTH2_PROXY_WHITELIST_DOMAINS   ok.<EC2_DOMAIN>
# oauth2-proxy reads an environment value before a value of this file. So a name of the
# list above must not be in this file, and compose.yaml must set no other OAUTH2_PROXY_
# name.
#
# Do not add one of these settings. Each one opens a path around the login:
#   skip_auth_routes, skip_auth_regex, skip_auth_preflight, trusted_ips,
#   skip_jwt_bearer_tokens, extra_jwt_issuers, htpasswd_file,
#   insecure_oidc_skip_issuer_verification, ssl_insecure_skip_verify.
# The agent does not pass the gate: it has a network of its own with OpenKnowledge
# (compose.yaml). So no path needs an exception here.

# ----- The listener -----
# Plain HTTP on port 4180, on each address of the container. The edge ends TLS. No port
# is published: the clients are the members of the Compose networks of this service.
http_address = "0.0.0.0:4180"

# ----- The edge -----
# The gate is behind the edge. It reads X-Forwarded-Proto, X-Forwarded-Host,
# X-Forwarded-Uri and X-Forwarded-For only from a client in the range below. That range is
# the edge network of the name `ok`. Its members are the edge and this service, and no
# other service. A client of another network cannot set these headers: the gate then uses
# the address and the path of the request itself.
# Keep the range equal to the `subnet` of the edge network of `ok` in the Compose files.
reverse_proxy = true
trusted_proxy_ips = ["198.18.5.0/29"]
real_client_ip_header = "X-Forwarded-For"

# ----- The identity provider -----
# Microsoft Entra ID, one tenant. The issuer holds the tenant id, so oauth2-proxy refuses
# a token of another tenant: the issuer of the token is not equal. The issuer `common` is
# not used.
provider = "entra-id"
# `profile` gives the claim preferred_username. `User.Read` lets oauth2-proxy read the
# groups from Microsoft Graph for a user with more than 200 groups. Without it, such a
# user gets no group and does not pass.
scope = "openid profile User.Read"
# The sign-in name of the user is the identity in the session and in the log. A token of
# Entra ID has the claim `email` only for a user with a mailbox, and oauth2-proxy stops a
# login with no identity.
oidc_email_claim = "preferred_username"
oidc_groups_claim = "groups"
# The gate checks the nonce of the ID token and uses PKCE.
insecure_oidc_skip_nonce = false
code_challenge_method = "S256"
# The group decides who passes (OAUTH2_PROXY_ALLOWED_GROUPS). The name of the user is not
# a second test, and oauth2-proxy needs this setting to start.
email_domains = ["*"]
# No page with a button: a request with no session goes to the login of Entra ID at once.
skip_provider_button = true

# ----- The session cookie -----
# The prefix `__Host-` makes the browser refuse the cookie without `Secure`, with a
# `Domain` or with a path that is not `/`. So the cookie goes to the host name `ok` only
# and to no other name of the domain. Do not set cookie_domains.
cookie_name = "__Host-ok"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
# A session ends after 12 hours. Then the user logs in again, and Entra ID reads the
# groups again. So a user who leaves the group keeps the access for 12 hours at most.
# No refresh: a refresh needs the scope offline_access and keeps a session open longer.
cookie_expire = "12h"

# ----- The upstream -----
# OpenKnowledge, on the network `knowledge`. It is the only upstream.
upstreams = ["http://open-knowledge:80/"]
# OpenKnowledge admits a request only with the host name of its public URL.
pass_host_header = true
# The editor uses a WebSocket and streamed responses.
proxy_websockets = true
flush_interval = "100ms"
# The name and the groups of the user go to OpenKnowledge as X-Forwarded-User,
# X-Forwarded-Email, X-Forwarded-Groups and X-Forwarded-Preferred-Username. A header of
# these names from the browser is removed first. No token goes to OpenKnowledge.
pass_user_headers = true
pass_basic_auth = false
pass_access_token = false
pass_authorization_header = false
skip_auth_strip_headers = true

# ----- Pages and log -----
# No version in the error page.
footer = "-"
show_debug_on_error = false
# The health check of the container calls /ready each 30 seconds.
silence_ping_logging = true
