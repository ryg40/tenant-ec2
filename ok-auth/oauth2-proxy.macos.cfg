# HTTP localhost only, carried by an encrypted operator tunnel.
# Tenant, issuer, client, group and cookie secrets come from Compose.
# No forwarded proxy trust, authentication bypass, or token forwarding.
http_address = "0.0.0.0:4180"
reverse_proxy = false
provider = "entra-id"
scope = "openid profile User.Read"
oidc_email_claim = "preferred_username"
oidc_groups_claim = "groups"
insecure_oidc_skip_nonce = false
code_challenge_method = "S256"
email_domains = ["*"]
skip_provider_button = true
cookie_name = "tenant-ec2-macos-ok"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "12h"
upstreams = ["http://open-knowledge:4180/"]
pass_host_header = true
proxy_websockets = true
flush_interval = "100ms"
pass_user_headers = true
pass_basic_auth = false
pass_access_token = false
pass_authorization_header = false
skip_auth_strip_headers = true
footer = "-"
show_debug_on_error = false
silence_ping_logging = true
