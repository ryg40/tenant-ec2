{
  "server": {"host": "0.0.0.0", "port": 1933, "root_api_key": "${OPENVIKING_ROOT_API_KEY}"},
  "storage": {"workspace": "/app/.openviking/data"},
  "embedding": {
    "dense": {
      "provider": "litellm",
      "api_key": "${OPENVIKING_LITELLM_API_KEY}",
      "api_base": "http://litellm:4000/v1",
      "model": "openai/${OPENVIKING_EMBED_MODEL}",
      "dimension": "${OPENVIKING_EMBED_DIMENSION}"
    }
  },
  "vlm": {
    "provider": "litellm",
    "api_key": "${OPENVIKING_LITELLM_API_KEY}",
    "api_base": "http://litellm:4000/v1",
    "model": "openai/${OPENVIKING_VLM_MODEL}",
    "temperature": 1
  }
}
