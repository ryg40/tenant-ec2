AWSTemplateFormatVersion: "2010-09-09"
Description: The Mac runtime on an existing M2 Dedicated Host, with private services and encrypted EBS.

# Separate allocation ownership permits release without deleting this runtime stack.
# AWS::EC2::Instance, HostId, Affinity and Tenancy:
# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-instance.html
# EC2 Mac instances, EBS and FileVault considerations:
# https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-mac-instances.html
# Session document schema, runAsEnabled and runAsDefaultUser:
# https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-schema.html
# ec2-macos-init, Userdata (ExecuteUserData must be enabled on the reviewed AMI):
# https://github.com/aws/ec2-macos-init#userdata
# Not verified: AMI startup, retained-volume recovery, scoped sessions, or the Podman runtime.
# No Memory resource policy exists here. The identity policy and separate boundary limit this role only.
Parameters:
  Project:
    Type: String
    Default: tenant-ec2
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"
  DedicatedHostId:
    Type: String
    AllowedPattern: "h-[0-9a-f]{17}"
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: The reviewed arm64 Mac image, resolved and pinned before this operation.
  VpcCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-6])$'
  RootVolumeSize:
    Type: Number
    Default: 100
    MinValue: 100
    MaxValue: 1000
    Description: GiB. Check the selected image minimum before deployment.
  DataVolumeSize:
    Type: String
    Default: '150'
    AllowedPattern: '^([1-9][0-9]{2}|1000)$'
    Description: Data EBS size in whole GiB, from 100 through 1000.
  PodmanProvider:
    Type: String
    Default: applehv
    AllowedPattern: '^applehv$'
  PodmanCpus:
    Type: String
    Default: '4'
    AllowedPattern: '^[1-8]$'
  PodmanMemoryMiB:
    Type: String
    Default: '8192'
    AllowedPattern: '^(102[4-9]|10[3-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|1[0-5][0-9]{3}|16[0-2][0-9]{2}|163[0-7][0-9]|1638[0-4])$'
    Description: Whole MiB, from 1024 through 16384.
  PodmanDiskGiB:
    Type: String
    Default: '80'
    AllowedPattern: '^([2-9][0-9]|[1-9][0-9]{2}|10[01][0-9]|102[0-4])$'
    Description: Whole GiB, from 20 through 1024.
  SshPublicKey:
    Type: String
    AllowedPattern: '^ssh-(ed25519|rsa) [A-Za-z0-9+/]+=*( [A-Za-z0-9_.@+-]{1,128})?$'
    Description: One owner public key with an optional single-word comment. No private key or password.
  SnapshotRepository:
    Type: String
    AllowedPattern: '^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._-]+)+$'
  SnapshotTag:
    Type: String
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'
  SnapshotCommit:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'
  MemoryStage:
    Type: String
    AllowedValues: [dev, test, prod]
  MemoryArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws(-[a-z]+)*:bedrock-agentcore:[a-z]{2}(-[a-z]+)+-[0-9]+:[0-9]{12}:memory/[A-Za-z][A-Za-z0-9_-]{0,127}$'
  MemoryBucket:
    Type: String
    NoEcho: true
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  AgentActorId:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,63}$'
  ProposalProject:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,63}$'
  DeveloperPin:
    Type: String
    AllowedPattern: '^XYZ[0-9]{4}$'
    Description: The active stage person's PIN. This is an identifier, not a password.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref VpcCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mac egress only. Interactive access uses SSM.
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - {IpProtocol: "-1", CidrIp: 0.0.0.0/0}
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
        - {Key: Purpose, Value: macos-data}
  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf
  EnvironmentSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Project}/macos/env
      Description: Private Mac service settings. Populate after stack creation, then retry bootstrap.
      SecretString: '{}'
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  GeneratedSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Project}/macos/generated
      Description: The Mac agent's gateway key. No OpenViking keys.
      SecretString: '{"EC2_PI_DURABLE_LITELLM_API_KEY":""}'
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-macos-role
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-macos-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: macos-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SsmAgent
                Effect: Allow
                Action:
                  - ssm:DescribeAssociation
                  - ssm:GetDeployablePatchSnapshotForInstance
                  - ssm:GetDocument
                  - ssm:DescribeDocument
                  - ssm:GetManifest
                  - ssm:ListAssociations
                  - ssm:ListInstanceAssociations
                  - ssm:PutInventory
                  - ssm:PutComplianceItems
                  - ssm:PutConfigurePackageResult
                  - ssm:UpdateAssociationStatus
                  - ssm:UpdateInstanceAssociationStatus
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                  - ec2messages:AcknowledgeMessage
                  - ec2messages:DeleteMessage
                  - ec2messages:FailMessage
                  - ec2messages:GetEndpoint
                  - ec2messages:GetMessages
                  - ec2messages:SendReply
                Resource: "*"
              - Sid: EnvSecretRead
                Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource: !Ref EnvironmentSecret
              - Sid: GeneratedSecretWrite
                Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret, secretsmanager:PutSecretValue]
                Resource: !Ref GeneratedSecret
              - Sid: BedrockLuna
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.openai.gpt-6-luna
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/openai.gpt-6-luna
              - Sid: BedrockEmbed
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              - Sid: MemoryRead
                Effect: Allow
                Action: [bedrock-agentcore:RetrieveMemoryRecords, bedrock-agentcore:ListMemoryRecords, bedrock-agentcore:GetMemoryRecord]
                Resource: !Ref MemoryArn
                Condition:
                  StringLike:
                    bedrock-agentcore:namespace: [/shared/*, /project/*/shared/*]
              - Sid: MemoryWrite
                Effect: Allow
                Action: bedrock-agentcore:BatchCreateMemoryRecords
                Resource: !Ref MemoryArn
                Condition:
                  ForAllValues:StringLike:
                    bedrock-agentcore:namespace: [!Sub '/project/${ProposalProject}/proposals/${AgentActorId}/*']
                  "Null":
                    bedrock-agentcore:namespace: "false"
              - Sid: BucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${MemoryBucket}
                Condition:
                  StringLike:
                    s3:prefix: [projects/*, !Sub 'users/${AgentActorId}/*']
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
              - Sid: BucketRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MemoryBucket}/projects/*
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
              - Sid: BucketWrite
                Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub arn:${AWS::Partition}:s3:::${MemoryBucket}/users/${AgentActorId}/*
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${Project}-macos
      Roles: [!Ref InstanceRole]
  SessionDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub ${Project}-macos-session
      DocumentType: Session
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '1.0'
        description: Interactive Mac sessions use only the stage PIN account.
        sessionType: Standard_Stream
        inputs:
          runAsEnabled: true
          # The accepted PIN prefix is fixed, so no lowercase macro or custom resource is needed.
          runAsDefaultUser: !Join ['', [xyz, !Select [1, !Split [XYZ, !Ref DeveloperPin]]]]
          idleSessionTimeout: '5'
          maxSessionDuration: '60'
          shellProfile:
            linux: !Sub
              - 'test "$(id -un)" = "${LoginUser}" && cd "/Users/${LoginUser}" && exec /bin/zsh -l; exit 1'
              - LoginUser: !Join ['', [xyz, !Select [1, !Split [XYZ, !Ref DeveloperPin]]]]
      Tags:
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRouteTableAssociation, SessionDocument]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: mac2-m2.metal
      AvailabilityZone: !Ref AvailabilityZone
      Tenancy: host
      Affinity: host
      HostId: !Ref DedicatedHostId
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/zsh
          [[ ! -o xtrace ]] || exit 1
          set -eu
          set -o pipefail
          umask 077
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
          unset AWS_PROFILE AWS_DEFAULT_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          unset AWS_ROLE_ARN AWS_ROLE_SESSION_NAME AWS_WEB_IDENTITY_TOKEN_FILE AWS_ENDPOINT_URL
          unset AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_AUTHORIZATION_TOKEN
          export AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_EC2_METADATA_DISABLED=false
          export AWS_IGNORE_CONFIGURED_ENDPOINT_URLS=true AWS_PAGER='' AWS_CLI_AUTO_PROMPT=off
          die() { print -u2 -- "macos user data: $1"; exit 1; }
          [[ ! -L /etc/${Project} && ! -L /etc/${Project}/machine.json ]] || die 'machine path needs review'
          for target in /opt /opt/${Project} /opt/${Project}/macos /opt/${Project}/macos/snapshot /opt/${Project}/macos/snapshot/.git; do
            [[ ! -L "$target" ]] || die 'snapshot path needs review'
          done
          install -d -o root -g admin -m 0755 /etc/${Project}
          install -d -o root -g admin -m 0700 /etc/${Project}/macos /opt/${Project}/macos
          temp=$(mktemp -d /etc/${Project}/macos/bootstrap.XXXXXXXX)
          trap 'rm -rf -- "$temp"' EXIT
          account=$(print -r -- '${DeveloperPin}' | tr '[:upper:]' '[:lower:]')
          # The parameter patterns exclude JSON escapes and shell syntax from every injected string.
          cat >"$temp/machine.json" <<EOT
          {
            "schemaVersion": 1,
            "project": "${Project}",
            "variant": "macos",
            "region": "${AWS::Region}",
            "engine": "podman",
            "fileSet": ["compose.macos.yaml"],
            "services": ["litellm", "litellm-db", "open-knowledge", "ok-auth"],
            "account": {
              "pin": "${DeveloperPin}",
              "name": "$account",
              "home": "/Users/$account",
              "shell": "/bin/zsh",
              "sshPublicKey": "${SshPublicKey}"
            },
            "disk": {"volumeId": "${DataVolume}", "mountPoint": "/Volumes/data"},
            "memory": {
              "stage": "${MemoryStage}",
              "agentActorId": "${AgentActorId}",
              "proposalProject": "${ProposalProject}",
              "configPath": "/run/tenant-ec2/memory.json"
            },
            "podman": {
              "provider": "${PodmanProvider}",
              "cpus": ${PodmanCpus},
              "memoryMiB": ${PodmanMemoryMiB},
              "diskGiB": ${PodmanDiskGiB}
            }
          }
          EOT
          plutil -lint "$temp/machine.json" >/dev/null 2>&1 || die 'invalid machine settings'
          install -o root -g admin -m 0644 "$temp/machine.json" /etc/${Project}/machine.json
          # This is staging only. The bootstrap verifies and mounts the data disk before runtime writes.
          repo=/opt/${Project}/macos/snapshot
          aws --region '${AWS::Region}' secretsmanager get-secret-value --secret-id '${EnvironmentSecret}' \
            --query SecretString --output text >"$temp/env.json" 2>/dev/null || die 'environment pending; explicit retry required'
          plutil -lint "$temp/env.json" >/dev/null 2>&1 || die 'invalid environment; explicit retry required'
          [[ "$(tr -d '[:space:]' <"$temp/env.json")" != '{}' ]] || die 'environment pending; explicit retry required'
          cat >"$temp/askpass" <<'EOT'
          #!/bin/zsh
          [[ ! -o xtrace ]] || exit 1
          case $1 in
            Username*) print -r -- x-access-token ;;
            *) /usr/bin/plutil -extract EC2_SNAPSHOT_CLONE_TOKEN raw -o - "$MACOS_BOOT_ENV" 2>/dev/null ;;
          esac
          EOT
          chmod 0700 "$temp/askpass"
          export MACOS_BOOT_ENV="$temp/env.json" GIT_ASKPASS="$temp/askpass" GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          if [[ ! -d "$repo/.git" ]]; then
            [[ ! -e "$repo" ]] || die 'snapshot destination needs review'
            git -c credential.helper= clone --depth 1 --branch '${SnapshotTag}' '${SnapshotRepository}' "$repo" \
              >/dev/null 2>&1 || die 'snapshot clone failed; explicit cleanup and retry required'
          fi
          [[ "$(git -C "$repo" rev-parse HEAD 2>/dev/null)" = '${SnapshotCommit}' ]] || die 'snapshot commit differs'
          tree_state=$(git -C "$repo" status --porcelain --untracked-files=all 2>/dev/null) || die 'snapshot status unreadable'
          [[ -z "$tree_state" ]] || die 'snapshot has local changes'
          [[ -f "$repo/scripts/host-bootstrap-macos.sh" ]] || die 'snapshot lacks Mac bootstrap'
          unset MACOS_BOOT_ENV GIT_ASKPASS
          # Keep the private JSON until bootstrap returns; the EXIT trap removes it on success or failure.
          chmod 0600 "$temp/env.json"
          /bin/zsh "$repo/scripts/host-bootstrap-macos.sh" \
            --machine /etc/${Project}/machine.json --env-file "$temp/env.json"
      Tags:
        - {Key: Name, Value: !Sub '${Project}-macos-host'}
        - {Key: Project, Value: !Ref Project}
        - {Key: Variant, Value: macos}

Outputs:
  InstanceId:
    Value: !Ref Instance
  HostId:
    Value: !Ref DedicatedHostId
  DataVolumeId:
    Value: !Ref DataVolume
  HostRoleArn:
    Value: !GetAtt InstanceRole.Arn
  SessionDocumentName:
    Value: !Ref SessionDocument
  DeveloperAccount:
    Description: The sole interactive developer account, derived from the stage PIN.
    Value: !Join ['', [xyz, !Select [1, !Split [XYZ, !Ref DeveloperPin]]]]
